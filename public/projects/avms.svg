  <text x="400" y="275" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">Automated Visitor Management</text>
  <text x="400" y="315" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">AVMS • IT Service Management (ITSM) Project</text>
  <text x="400" y="355" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">QR Access Control • RBAC &amp; MFA • 99.9% SLA • Audit Logs</text>
</svg>
